<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="{{ t('meta.description') }}">
<meta name="theme-color" content="#0f172a">
{% if meta_robots is defined %}<meta name="robots" content="{{ meta_robots }}">
{% endif %}
<link rel="canonical" href="{{ canonical_url }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:locale" content="{{ og_locale }}">
{% for alt in og_locale_alternates %}<meta property="og:locale:alternate" content="{{ alt }}">
{% endfor %}
<meta property="og:site_name" content="{{ t('site.name') }}">
<meta property="og:title" content="{{ og_title|default(t('site.name')) }}">
<meta property="og:description" content="{{ t('meta.og_description') }}">
<meta property="og:image" content="{{ og_image_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="{{ og_image_width }}">
<meta property="og:image:height" content="{{ og_image_height }}">
<meta property="og:image:alt" content="{{ t('meta.og_image_alt') }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ og_title|default(t('site.name')) }}">
<meta name="twitter:description" content="{{ t('meta.og_description') }}">
<meta name="twitter:image" content="{{ og_image_url }}">
<meta name="twitter:image:alt" content="{{ t('meta.og_image_alt') }}">
<link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
<style>
.lang-bar { display: flex; justify-content: flex-end; max-width: 720px; margin: 0 auto 4px; }
.lang-switch { display: inline-flex; border: 1px solid #475569; border-radius: 999px; overflow: hidden; font-size: 14px; }
.lang-switch a {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 52px; min-height: 36px; padding: 4px 12px;
  color: #cbd5e1; text-decoration: none;
}
.lang-switch a + a { border-left: 1px solid #475569; }
.lang-switch a:hover { background: #1e293b; color: #f0fdf4; }
.lang-switch a[aria-current="true"] { background: #22c55e; color: #052e16; font-weight: 600; }
.lang-switch a:focus-visible { outline: 3px solid #86efac; outline-offset: -3px; }
</style>
